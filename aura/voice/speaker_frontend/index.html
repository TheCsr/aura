<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AURA Speaker</title>
  <style>
    :root { color-scheme: dark; font-family: "Trebuchet MS", sans-serif; color: #e5e7eb; }
    body { margin: 0; padding: 12px 0; background: transparent; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; }
    button { min-height: 44px; border: 1px solid #454c53; border-radius: 6px; padding: 8px 14px; background: #1c2428; color: #e5e7eb; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid #83c7b6; outline-offset: 2px; }
    button:disabled { opacity: .45; cursor: default; }
    #enable { background: #246456; }
    p { margin: 12px 0 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
    #status[data-error="true"] { color: #f5c17a; }
    #voice { color: #a9b6bc; font-size: 12px; }
  </style>
</head>
<body>
  <div class="controls">
    <button id="enable" type="button">Enable audio</button>
    <button id="replay" type="button" disabled>Replay</button>
    <button id="stop" type="button" disabled>Stop</button>
    <button id="fallback" type="button" disabled>Google Translate (demo)</button>
  </div>
  <p id="status" role="status" aria-live="polite">Audio is off.</p>
  <p id="voice"></p>
  <script src="speaker.js"></script>
</body>
</html>
